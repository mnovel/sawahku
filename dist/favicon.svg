<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="padiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Skala diperbesar (scale 1.35) agar ikon tampak lebih besar dan jelas -->
  <g transform="translate(128, 128) scale(1.35)" filter="url(#shadow)">
    <!-- Butir Padi Kiri & Kanan Luar -->
    <path d="M-10,-70 C-40,-80 -50,-50 -25,-30 C-12,-20 0,-40 0,-70 Z" fill="url(#padiGrad)" />
    <path d="M10,-70 C40,-80 50,-50 25,-30 C12,-20 0,-40 0,-70 Z" fill="url(#padiGrad)" opacity="0.9" />

    <path d="M-10,20 C-40,10 -50,40 -25,60 C-12,70 0,50 0,20 Z" fill="url(#padiGrad)" />
    <path d="M10,20 C40,10 50,40 25,60 C12,70 0,50 0,20 Z" fill="url(#padiGrad)" opacity="0.9" />

    <!-- Batang Bawah -->
    <path d="M0,80 L0,30" stroke="url(#padiGrad)" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Bagian Tengah: Tunas Daun Hijau Kembar -->
    <path d="M0,30 C-25,15 -35,-15 0,-35 C35,-15 25,15 0,30 Z" fill="url(#leafGrad)" />
    <path d="M0,25 C-15,10 -20,-10 0,-25 C20,-10 15,10 0,25 Z" fill="#6ee7b7" opacity="0.4" />
  </g>
</svg>