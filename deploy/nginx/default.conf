server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Aset ber-hash dari Vite boleh di-cache lama.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Jangan cache index.html agar deploy baru langsung terpakai.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # nginx belum memetakan ekstensi .webmanifest ke MIME yang benar.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Service worker selalu divalidasi ulang (Cloudflare bisa menimpa header
    # ini untuk .js, karena itu URL registrasinya diberi ?v=<hash bundle>).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Resolver DNS internal Docker; proxy_pass memakai variabel agar nginx
    # tidak gagal start ketika container pocketbase sedang restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pocketbase http://pocketbase:8090;

    location /api/ {
        proxy_pass $pocketbase;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    # SPA fallback untuk React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
